name: ShowBuilder3D
options:
  bundleIdPrefix: com.yamaha.showbuilder
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ShowBuilder3D:
    type: application
    platform: iOS
    sources:
      - path: ShowBuilder3D
        excludes:
          - "**/*.md"
    info:
      path: ShowBuilder3D/App/Info.plist
      properties:
        CFBundleDisplayName: ShowBuilder 3D
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Used to capture multi-camera imagery for 3D scanning."
        NSPhotoLibraryAddUsageDescription: "Used to save exported STL files."
        UIRequiredDeviceCapabilities:
          - arkit
          - armv7
        ARKitRequiresPro: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yamaha.showbuilder.scanner
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    dependencies: []
